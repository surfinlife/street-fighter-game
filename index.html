<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Street Fighter II - Arcade Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{overflow:hidden;background:#0a0010;}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;}
#wrap{width:100%;max-width:680px;margin:0 auto;background:#000;border-radius:10px;overflow:hidden;border:2px solid #444;touch-action:none;}
#cv{display:block;width:100%;height:auto;touch-action:none;}
/* CONTROLS */
#ctrl{width:100%;background:#0d0d0d;padding:12px 10px 18px;display:flex;justify-content:space-between;align-items:center;touch-action:none;}
/* D-PAD */
#dpad{position:relative;width:148px;height:148px;flex-shrink:0;touch-action:none;}
.dp{position:absolute;background:rgba(255,255,255,0.10);border:2px solid rgba(255,255,255,0.22);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.65);touch-action:none;}
.dp.act{background:rgba(255,255,255,0.35);border-color:rgba(255,255,255,0.6);}
#dU{top:0;left:50px;width:48px;height:48px;}
#dD{bottom:0;left:50px;width:48px;height:48px;}
#dL{top:50px;left:0;width:48px;height:48px;}
#dR{top:50px;left:100px;width:48px;height:48px;}
#dC{top:50px;left:50px;width:48px;height:48px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.10);border-radius:50%;}
/* ACTION BUTTONS */
#abwrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
#abrow1{display:flex;gap:12px;}
.ab{width:62px;height:62px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:monospace;color:#fff;background:rgba(0,0,0,0.5);touch-action:none;}
.ab.act{transform:scale(0.88);filter:brightness(1.5);}
#bP{border-color:#4499FF;color:#88CCFF;}
#bP.act{background:rgba(68,153,255,0.55);}
#bK{border-color:#FF6600;color:#FFAA44;}
#bK.act{background:rgba(255,102,0,0.55);}
#bS{border-color:#FFD700;color:#FFD700;width:56px;height:56px;font-size:10px;line-height:1.3;text-align:center;}
#bS.act{background:rgba(255,215,0,0.45);}
/* OVERLAYS */
#ts,#gs{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.91);z-index:20;touch-action:auto;}
#ts h1{font-size:22px;font-weight:700;color:#FFD700;letter-spacing:4px;margin-bottom:4px;text-shadow:2px 2px #CC0000;}
#ts h2{font-size:10px;color:#FF4400;letter-spacing:6px;margin-bottom:20px;}
.btn{background:#880000;color:#FFD700;border:2px solid #CC8800;padding:12px 32px;font-size:13px;font-family:monospace;font-weight:700;letter-spacing:2px;cursor:pointer;border-radius:3px;margin:5px;touch-action:manipulation;}
.btn:active{background:#CC0000;}
.ci{margin-top:14px;color:#777;font-size:10px;line-height:2.2;text-align:center;}
.ci b{color:#FFD700;}
#gs h1{font-size:20px;color:#FFD700;margin-bottom:6px;text-shadow:2px 2px #CC0000;}
#gs p{color:#aaa;font-size:12px;margin-bottom:16px;}
</style>
</head>
<body>
<div id="wrap">
  <div style="position:relative;">
    <canvas id="cv" width="680" height="400"></canvas>
    <div id="ts">
      <h1>STREET FIGHTER II</h1>
      <h2>― CHAMPION EDITION ―</h2>
      <button class="btn" id="s1">GAME START</button>
      <div class="ci">
        <b>スマホ:</b> 下のDパッド＋ボタンで操作<br>
        <b>PC:</b> A/D移動 W=ジャンプ S=しゃがみ<br>
        J=パンチ K=キック U=波動拳
      </div>
    </div>
    <div id="gs" style="display:none;">
      <h1 id="wt">RYU WINS!</h1>
      <p id="rt">Round 1</p>
      <button class="btn" id="rb">REMATCH</button>
      <button class="btn" id="mb" style="background:#111;border-color:#444;">MENU</button>
    </div>
  </div>
  <!-- TOUCH CONTROLS -->
  <div id="ctrl">
    <div id="dpad">
      <div class="dp" id="dU">▲</div>
      <div class="dp" id="dD">▼</div>
      <div class="dp" id="dL">◀</div>
      <div class="dp" id="dR">▶</div>
      <div id="dC"></div>
    </div>
    <div id="abwrap">
      <div style="color:#444;font-size:9px;font-family:monospace;letter-spacing:1px;">SUPER GAUGE</div>
      <div id="abrow1">
        <div class="ab" id="bP">PUNCH</div>
        <div class="ab" id="bK">KICK</div>
      </div>
      <div class="ab" id="bS">波動拳<br>SUPER</div>
    </div>
  </div>
</div>

<script>
// =============================================
// VIRTUAL INPUT — pointer-based multi-touch
// =============================================
const vk = {up:false, down:false, left:false, right:false, punch:false, kick:false, special:false};
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; }, true);
document.addEventListener('keyup',   e => { keys[e.code] = false; }, true);

function syncKeys() {
  vk.up      = keys['KeyW'] || keys['ArrowUp'];
  vk.down    = keys['KeyS'] || keys['ArrowDown'];
  vk.left    = keys['KeyA'] || keys['ArrowLeft'];
  vk.right   = keys['KeyD'] || keys['ArrowRight'];
  vk.punch   = keys['KeyJ'];
  vk.kick    = keys['KeyK'];
  vk.special = keys['KeyU'];
}

// Track which pointerIds are pressing each button
function makeBtn(el, prop) {
  const ids = new Set();
  function update() {
    const on = ids.size > 0;
    vk[prop] = on;
    el.classList.toggle('act', on);
  }
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    ids.add(e.pointerId);
    update();
  });
  el.addEventListener('pointerup', e => {
    e.preventDefault();
    ids.delete(e.pointerId);
    update();
  });
  el.addEventListener('pointercancel', e => {
    e.preventDefault();
    ids.delete(e.pointerId);
    update();
  });
}

makeBtn(document.getElementById('bP'), 'punch');
makeBtn(document.getElementById('bK'), 'kick');
makeBtn(document.getElementById('bS'), 'special');

// D-PAD: joystick-style — track pointer offset from center
const dpad = document.getElementById('dpad');
const dEls = {
  up:    document.getElementById('dU'),
  down:  document.getElementById('dD'),
  left:  document.getElementById('dL'),
  right: document.getElementById('dR'),
};
const dpadPointers = new Map(); // pointerId → {x,y}

function updateDpad() {
  // Compute centroid of all active pointers
  if (dpadPointers.size === 0) {
    vk.up = vk.down = vk.left = vk.right = false;
  } else {
    const rect = dpad.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let tx = 0, ty = 0;
    for (const [, p] of dpadPointers) { tx += p.x; ty += p.y; }
    tx /= dpadPointers.size;
    ty /= dpadPointers.size;
    const dx = tx - cx, dy = ty - cy;
    const dead = 14;
    vk.left  = dx < -dead;
    vk.right = dx > dead;
    vk.up    = dy < -dead;
    vk.down  = dy > dead;
  }
  // Sync key overrides (keyboard)
  if (keys['KeyA'] || keys['ArrowLeft'])  vk.left  = true;
  if (keys['KeyD'] || keys['ArrowRight']) vk.right = true;
  if (keys['KeyW'] || keys['ArrowUp'])    vk.up    = true;
  if (keys['KeyS'] || keys['ArrowDown'])  vk.down  = true;

  dEls.up.classList.toggle('act',    vk.up);
  dEls.down.classList.toggle('act',  vk.down);
  dEls.left.classList.toggle('act',  vk.left);
  dEls.right.classList.toggle('act', vk.right);
}

dpad.addEventListener('pointerdown', e => {
  e.preventDefault();
  dpad.setPointerCapture(e.pointerId);
  dpadPointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  updateDpad();
});
dpad.addEventListener('pointermove', e => {
  if (!dpadPointers.has(e.pointerId)) return;
  e.preventDefault();
  dpadPointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  updateDpad();
});
dpad.addEventListener('pointerup', e => {
  e.preventDefault();
  dpadPointers.delete(e.pointerId);
  updateDpad();
});
dpad.addEventListener('pointercancel', e => {
  e.preventDefault();
  dpadPointers.delete(e.pointerId);
  updateDpad();
});

// Prevent context menu & scroll on the control area
document.getElementById('ctrl').addEventListener('contextmenu', e => e.preventDefault());

// =============================================
// GAME ENGINE
// =============================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 680, H = 400, GND = H - 80;

const ATK = {
  punch:  {st:4, ac:9, rc:12, dmg:9,  rx:72, ry:-68, rw:58, rh:22},
  kick:   {st:6, ac:8, rc:16, dmg:13, rx:60, ry:-40, rw:65, rh:24},
  cPunch: {st:3, ac:9, rc:10, dmg:8,  rx:68, ry:-42, rw:55, rh:20},
  cKick:  {st:5, ac:9, rc:14, dmg:11, rx:55, ry:-28, rw:70, rh:20},
  jPunch: {st:3, ac:9, rc:9,  dmg:10, rx:55, ry:-70, rw:55, rh:22},
  jKick:  {st:4, ac:8, rc:10, dmg:12, rx:52, ry:-45, rw:62, rh:22},
};

let projs=[], p1, p2, gst='menu', rnd=1, tim=99, tiv, shake=0, parts=[], bgS=0, flashMsg='', flashT=0;

function mkF(x, facing, isAI) {
  return {x, y:GND, vx:0, vy:0, w:52, h:90, hp:100, mhp:100, facing, state:'idle',
    atkPhase:0, atkTimer:0, atkType:'', atkSt:0, atkAc:0, atkRc:0,
    hitT:0, blkT:0, onG:true, isAI, sp:0, msp:100, efx:[], wins:0, animT:0, aiCD:0};
}

function initR() {
  p1 = mkF(120, 1, false);
  p2 = mkF(488, -1, true);
  gst = 'fight'; tim = 99; parts = []; projs = []; shake = 0;
  flashMsg = 'FIGHT!!'; flashT = 80;
  clearInterval(tiv);
  tiv = setInterval(() => { if (gst === 'fight') { tim--; if (tim <= 0) endR(); } }, 1000);
}

// ---- BACKGROUND ----
function drawBG() {
  bgS += 0.06;
  const sky = ctx.createLinearGradient(0,0,0,GND);
  sky.addColorStop(0,'#1a5fa8'); sky.addColorStop(0.6,'#3a8fd8'); sky.addColorStop(1,'#7ab8e8');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,GND);
  ctx.fillStyle='#FFF8DC'; ctx.beginPath(); ctx.arc(W*0.8,65,36,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFEC8B'; ctx.beginPath(); ctx.arc(W*0.8,65,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4a7eb5';
  ctx.beginPath(); ctx.moveTo(0,GND-50);
  for(let i=0;i<=W;i+=40) ctx.lineTo(i, GND-50-Math.sin(i*0.02+1)*26-Math.sin(i*0.05)*12);
  ctx.lineTo(W,GND); ctx.lineTo(0,GND); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c8a870';
  for(let i=0;i<5;i++) ctx.fillRect(55+i*128, GND-160, 30, 160);
  ctx.fillStyle='#e8c888';
  for(let i=0;i<5;i++){const bx=55+i*128; ctx.fillRect(bx-7,GND-170,44,14); ctx.fillRect(bx-3,GND-182,36,14);}
  ctx.fillStyle='#d4a850'; ctx.fillRect(185,GND-200,310,200);
  ctx.fillStyle='#b88c40'; ctx.fillRect(205,GND-182,270,182);
  ctx.fillStyle='#5a3010';
  for(let i=0;i<4;i++) ctx.fillRect(215+i*62, GND-155, 26, 44);
  ctx.fillStyle='#8B6914'; ctx.fillRect(295,GND-235,90,235);
  ctx.fillStyle='#6B5010'; ctx.beginPath(); ctx.arc(340,GND-258,30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.fillRect(326,GND-264,5,5); ctx.fillRect(349,GND-264,5,5);
  const flr = ctx.createLinearGradient(0,GND,0,H);
  flr.addColorStop(0,'#c8a860'); flr.addColorStop(1,'#a88840');
  ctx.fillStyle=flr; ctx.fillRect(0,GND,W,H-GND);
  ctx.strokeStyle='#b89850'; ctx.lineWidth=1;
  for(let i=0;i<W;i+=34){ctx.beginPath();ctx.moveTo(i,GND);ctx.lineTo(i,H);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,GND-3,W,7);
}

// ---- RYU ----
function drawRyu(f) {
  const cr = f.state==='crouch'||f.atkType==='cPunch'||f.atkType==='cKick';
  const yo = cr ? 18 : 0;
  ctx.save();
  if(f.hitT>0 && f.hitT%6<3) ctx.globalAlpha=0.35;
  ctx.translate(Math.round(f.x+f.w/2), Math.round(f.y));
  ctx.scale(f.facing, 1);
  const lw = f.onG && f.state==='walk' ? Math.sin(f.animT*0.28)*9 : 0;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,0,26,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1C3A6A';
  if(cr){ctx.fillRect(-21,-24,17,24);ctx.fillRect(4,-24,17,24);}
  else{ctx.fillRect(-21,-38+lw,17,38);ctx.fillRect(4,-38-lw,17,38);}
  ctx.fillStyle='#E8E8E8';
  if(cr){ctx.fillRect(-23,-4,21,9);ctx.fillRect(2,-4,21,9);}
  else{ctx.fillRect(-23,lw-4,21,9);ctx.fillRect(2,-lw-4,21,9);}
  ctx.fillStyle='#F0F0F0'; ctx.beginPath(); ctx.roundRect(-23,-88+yo,46,54,4); ctx.fill();
  ctx.fillStyle='#D8D8D8'; ctx.fillRect(-23,-88+yo,6,54); ctx.fillRect(17,-88+yo,6,54);
  ctx.fillStyle='#C8C8C8'; ctx.beginPath(); ctx.moveTo(-5,-88+yo); ctx.lineTo(0,-68+yo); ctx.lineTo(5,-88+yo); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(-23,-36+yo,46,7);
  if(f.atkPhase===2 && (f.atkType==='punch'||f.atkType==='jPunch')){
    ctx.fillStyle='#F0F0F0'; ctx.fillRect(19,-80+yo,44,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(60,-84+yo,15,17);
    ctx.fillStyle='#D4A888'; ctx.fillRect(69,-82+yo,4,4); ctx.fillRect(69,-76+yo,4,4);
  } else if(f.atkPhase===2 && f.atkType==='cPunch'){
    ctx.fillStyle='#F0F0F0'; ctx.fillRect(19,-58+yo,42,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(58,-62+yo,15,17);
  } else if(f.atkPhase===2 && (f.atkType==='kick'||f.atkType==='jKick')){
    ctx.fillStyle='#1C3A6A'; ctx.fillRect(13,-38+yo,46,13);
    ctx.fillStyle='#E8E8E8'; ctx.fillRect(50,-44+yo,17,17);
  } else if(f.atkPhase===2 && f.atkType==='cKick'){
    ctx.fillStyle='#1C3A6A'; ctx.fillRect(7,-22,50,13);
    ctx.fillStyle='#E8E8E8'; ctx.fillRect(50,-26,17,17);
  } else if(f.state==='special' || (f.atkPhase>=1 && f.atkType==='special')){
    ctx.fillStyle='#F0F0F0'; ctx.fillRect(17,-76+yo,38,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(50,-80+yo,15,17);
    const ga=ctx.globalAlpha; ctx.globalAlpha=ga*0.7; ctx.fillStyle='#4499FF';
    ctx.beginPath(); ctx.arc(67,-72+yo,11,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=ga;
    ctx.fillStyle='#F0F0F0'; ctx.fillRect(-32,-76+yo,12,26);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(-34,-76+yo,13,13);
  } else {
    ctx.fillStyle='#F0F0F0'; ctx.fillRect(-32,-82+yo,11,28); ctx.fillRect(21,-82+yo,11,28);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(-34,-82+yo,13,13); ctx.fillRect(21,-82+yo,13,13);
  }
  ctx.fillStyle='#F5C5A0'; ctx.beginPath(); ctx.arc(0,-100+yo,15,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#CC0000'; ctx.fillRect(-15,-108+yo,30,7);
  ctx.fillStyle='#1A0800'; ctx.beginPath(); ctx.arc(0,-112+yo,12,Math.PI,0); ctx.fill(); ctx.fillRect(-12,-113+yo,24,7);
  ctx.fillStyle='#2a1200'; ctx.fillRect(-6,-103+yo,4,4); ctx.fillRect(3,-103+yo,4,4);
  ctx.fillStyle='#1A0800'; ctx.fillRect(-8,-107+yo,6,2); ctx.fillRect(2,-107+yo,6,2);
  if(f.blkT>0){ctx.fillStyle='rgba(100,200,255,0.28)'; ctx.beginPath(); ctx.arc(0,-56+yo,34,0,Math.PI*2); ctx.fill();}
  ctx.restore();
}

// ---- KEN ----
function drawKen(f) {
  const cr = f.state==='crouch'||f.atkType==='cPunch'||f.atkType==='cKick';
  const yo = cr ? 18 : 0;
  ctx.save();
  if(f.hitT>0 && f.hitT%6<3) ctx.globalAlpha=0.35;
  ctx.translate(Math.round(f.x+f.w/2), Math.round(f.y));
  ctx.scale(f.facing, 1);
  const lw = f.onG && f.state==='walk' ? Math.sin(f.animT*0.28)*9 : 0;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,0,26,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#AA1800';
  if(cr){ctx.fillRect(-21,-24,17,24);ctx.fillRect(4,-24,17,24);}
  else{ctx.fillRect(-21,-38+lw,17,38);ctx.fillRect(4,-38-lw,17,38);}
  ctx.fillStyle='#E8E8E8';
  if(cr){ctx.fillRect(-23,-4,21,9);ctx.fillRect(2,-4,21,9);}
  else{ctx.fillRect(-23,lw-4,21,9);ctx.fillRect(2,-lw-4,21,9);}
  ctx.fillStyle='#CC2200'; ctx.beginPath(); ctx.roundRect(-23,-88+yo,46,54,4); ctx.fill();
  ctx.fillStyle='#AA1800'; ctx.fillRect(-23,-88+yo,6,54); ctx.fillRect(17,-88+yo,6,54);
  ctx.fillStyle='#BB1E00'; ctx.beginPath(); ctx.moveTo(-5,-88+yo); ctx.lineTo(0,-68+yo); ctx.lineTo(5,-88+yo); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#C8A000'; ctx.fillRect(-23,-36+yo,46,7);
  ctx.fillStyle='#FFD700'; ctx.fillRect(-23,-34+yo,46,3);
  if(f.atkPhase===2 && (f.atkType==='punch'||f.atkType==='jPunch')){
    ctx.fillStyle='#CC2200'; ctx.fillRect(19,-80+yo,44,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(60,-84+yo,15,17);
    ctx.fillStyle='#D4A888'; ctx.fillRect(69,-82+yo,4,4); ctx.fillRect(69,-76+yo,4,4);
  } else if(f.atkPhase===2 && f.atkType==='cPunch'){
    ctx.fillStyle='#CC2200'; ctx.fillRect(19,-58+yo,42,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(58,-62+yo,15,17);
  } else if(f.atkPhase===2 && (f.atkType==='kick'||f.atkType==='jKick')){
    ctx.fillStyle='#AA1800'; ctx.fillRect(13,-38+yo,46,13);
    ctx.fillStyle='#E8E8E8'; ctx.fillRect(50,-44+yo,17,17);
    const ga=ctx.globalAlpha; ctx.globalAlpha=ga*0.55; ctx.fillStyle='#FF6600';
    ctx.beginPath(); ctx.arc(58,-37+yo,11,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=ga;
  } else if(f.atkPhase===2 && f.atkType==='cKick'){
    ctx.fillStyle='#AA1800'; ctx.fillRect(7,-22,50,13);
    ctx.fillStyle='#E8E8E8'; ctx.fillRect(50,-26,17,17);
  } else if(f.state==='special' || (f.atkPhase>=1 && f.atkType==='special')){
    ctx.fillStyle='#CC2200'; ctx.fillRect(17,-76+yo,38,13);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(50,-80+yo,15,17);
    const ga=ctx.globalAlpha; ctx.globalAlpha=ga*0.7; ctx.fillStyle='#FF6600';
    ctx.beginPath(); ctx.arc(67,-72+yo,11,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=ga;
    ctx.fillStyle='#CC2200'; ctx.fillRect(-32,-76+yo,12,26);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(-34,-76+yo,13,13);
  } else {
    ctx.fillStyle='#CC2200'; ctx.fillRect(-32,-82+yo,11,28); ctx.fillRect(21,-82+yo,11,28);
    ctx.fillStyle='#F5C5A0'; ctx.fillRect(-34,-82+yo,13,13); ctx.fillRect(21,-82+yo,13,13);
  }
  ctx.fillStyle='#F5C5A0'; ctx.beginPath(); ctx.arc(0,-100+yo,15,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#C89010'; ctx.beginPath(); ctx.arc(0,-112+yo,12,Math.PI,0); ctx.fill(); ctx.fillRect(-12,-113+yo,24,8);
  ctx.fillStyle='#D4A020';
  [[-10,-122],[-2,-126],[6,-124],[11,-120]].forEach(([sx,sy]) => {
    ctx.beginPath(); ctx.moveTo(sx-4,-113+yo); ctx.lineTo(sx,sy+yo); ctx.lineTo(sx+4,-113+yo); ctx.fill();
  });
  ctx.fillStyle='#CC0000'; ctx.fillRect(-13,-116+yo,26,5);
  ctx.fillStyle='#2a1200'; ctx.fillRect(-6,-103+yo,4,4); ctx.fillRect(3,-103+yo,4,4);
  ctx.fillStyle='#C89010'; ctx.fillRect(-8,-107+yo,6,2); ctx.fillRect(2,-107+yo,6,2);
  if(f.blkT>0){ctx.fillStyle='rgba(255,150,50,0.28)'; ctx.beginPath(); ctx.arc(0,-56+yo,34,0,Math.PI*2); ctx.fill();}
  ctx.restore();
}

// ---- HADOUKEN ----
function fireHadouken(f) {
  if(f.sp < f.msp) return false;
  f.sp = 0;
  projs.push({
    x: f.facing===1 ? f.x+f.w : f.x,
    y: f.y-50, w:44, h:32,
    vx: f.facing*9,
    isP1: f===p1,
    life:80, frame:0,
    color: f===p1 ? '#4499FF' : '#FF6600'
  });
  return true;
}

function drawProjs() {
  projs = projs.filter(p => {
    p.x += p.vx; p.life--; p.frame = (p.frame+1)%6;
    if(p.x<-80 || p.x>W+80 || p.life<=0) return false;
    const tgt = p.isP1 ? p2 : p1;
    if(p.x+p.w>tgt.x && p.x<tgt.x+tgt.w && p.y+p.h>tgt.y-tgt.h && p.y<tgt.y) {
      if(tgt.hitT===0) {
        const src = p.isP1 ? p1 : p2;
        const blk = tgt.blkT>0 && tgt.facing!==src.facing;
        const dmg = blk ? 3 : 20;
        tgt.hp = Math.max(0, tgt.hp-dmg);
        tgt.hitT = 22; tgt.vx = p.vx*0.4;
        if(!blk) { shake=8; addEfx(tgt,'-'+dmg,'#FF4444',16); }
        hitParts(p.x+p.w/2, p.y+p.h/2, p.color, 14);
        if(tgt.hp<=0) endR();
      }
      return false;
    }
    ctx.save();
    const px=p.x+p.w/2, py=p.y+p.h/2, r=p.h/2, pulse=Math.sin(p.frame*1.2)*2;
    ctx.globalAlpha=0.28; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.ellipse(px,py,r+10+pulse,r+6+pulse,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.6; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.ellipse(px,py,r+4+pulse,r+2+pulse,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    const g = ctx.createRadialGradient(px,py,2,px,py,r+pulse);
    g.addColorStop(0,'#FFF'); g.addColorStop(0.4,p.color); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(px,py,r+pulse,r-2+pulse,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=p.color; ctx.lineWidth=1.5; ctx.globalAlpha=0.7;
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+p.frame*0.4;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px+Math.cos(a)*(r+8+pulse), py+Math.sin(a)*(r+8+pulse)); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    return true;
  });
}

// ---- HUD ----
function drawHUD() {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,54);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,54,W,3);
  [[2,p1,'#F0F0F0','#CC0000'],[W-54,p2,'#CC2200','#C89010']].forEach(([bx,f,gc,hc],i) => {
    ctx.fillStyle='#111'; ctx.fillRect(bx,2,52,52);
    ctx.strokeStyle='#CC8800'; ctx.lineWidth=2; ctx.strokeRect(bx,2,52,52);
    const fx=bx+26;
    ctx.fillStyle='#F5C5A0'; ctx.beginPath(); ctx.arc(fx,20,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=hc; ctx.beginPath(); ctx.arc(fx,11,8,Math.PI,0); ctx.fill(); ctx.fillRect(fx-8,10,16,5);
    ctx.fillStyle=gc; ctx.fillRect(bx+(i===0?8:2),28,i===0?36:40,20);
    if(i===0){ctx.fillStyle='#FFD700'; ctx.font='bold 10px sans-serif'; ctx.fillText('★',bx+4,13);}
  });
  ctx.fillStyle='#000'; ctx.fillRect(56,2,136,18); ctx.strokeStyle='#CC8800'; ctx.lineWidth=1; ctx.strokeRect(56,2,136,18);
  ctx.fillStyle='#FFD700'; ctx.font='bold 12px monospace'; ctx.textAlign='left'; ctx.fillText('RYU',60,15);
  ctx.fillStyle='#000'; ctx.fillRect(W-192,2,136,18); ctx.strokeStyle='#CC8800'; ctx.strokeRect(W-192,2,136,18);
  ctx.fillStyle='#FFD700'; ctx.textAlign='right'; ctx.fillText('KEN',W-60,15);
  const bw=228;
  ctx.fillStyle='#000'; ctx.fillRect(56,22,bw,15); ctx.fillStyle='#006600'; ctx.fillRect(56,22,bw,15);
  const p1w=Math.max(0,(p1.hp/p1.mhp)*bw);
  ctx.fillStyle=p1.hp>50?'#EEFF00':p1.hp>25?'#FFAA00':'#FF2200'; ctx.fillRect(56,22,p1w,15);
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(56,22,p1w,5);
  ctx.strokeStyle='#CC8800'; ctx.lineWidth=1; ctx.strokeRect(56,22,bw,15);
  ctx.fillStyle='#000'; ctx.fillRect(W-56-bw,22,bw,15); ctx.fillStyle='#006600'; ctx.fillRect(W-56-bw,22,bw,15);
  const p2w=Math.max(0,(p2.hp/p2.mhp)*bw);
  ctx.fillStyle=p2.hp>50?'#EEFF00':p2.hp>25?'#FFAA00':'#FF2200'; ctx.fillRect(W-56-p2w,22,p2w,15);
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(W-56-p2w,22,p2w,5);
  ctx.strokeStyle='#CC8800'; ctx.strokeRect(W-56-bw,22,bw,15);
  ctx.fillStyle='#000022'; ctx.fillRect(56,39,bw,8); ctx.fillStyle='#2255BB'; ctx.fillRect(56,39,(p1.sp/p1.msp)*bw,8); ctx.strokeStyle='#4477EE'; ctx.lineWidth=1; ctx.strokeRect(56,39,bw,8);
  ctx.fillStyle='#000022'; ctx.fillRect(W-56-bw,39,bw,8);
  const p2sw=(p2.sp/p2.msp)*bw; ctx.fillStyle='#BB4400'; ctx.fillRect(W-56-p2sw,39,p2sw,8); ctx.strokeStyle='#FF7700'; ctx.strokeRect(W-56-bw,39,bw,8);
  if(p1.sp>=p1.msp){ctx.fillStyle='#88AAFF';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.fillText('SUPER',58,47);}
  if(p2.sp>=p2.msp){ctx.fillStyle='#FFAA44';ctx.textAlign='right';ctx.fillText('SUPER',W-58,47);}
  ctx.fillStyle='#000'; ctx.fillRect(W/2-26,2,52,50); ctx.strokeStyle='#CC8800'; ctx.lineWidth=2; ctx.strokeRect(W/2-26,2,52,50);
  ctx.fillStyle='#CC0000'; ctx.font='bold 28px monospace'; ctx.textAlign='center'; ctx.fillText(String(tim).padStart(2,'0'),W/2,40);
  for(let i=0;i<p1.wins;i++){ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(295+i*16,11,6,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<p2.wins;i++){ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(W-295-i*16,11,6,0,Math.PI*2);ctx.fill();}
  if(flashT>0){
    flashT--;
    ctx.globalAlpha=Math.min(1,flashT/18);
    ctx.font='bold 46px monospace'; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.55)';
    const tw=ctx.measureText(flashMsg).width;
    ctx.fillRect(W/2-tw/2-8,H/2-50,tw+16,58);
    ctx.strokeStyle='#CC0000'; ctx.lineWidth=2; ctx.strokeText(flashMsg,W/2,H/2);
    ctx.fillStyle='#FFD700'; ctx.fillText(flashMsg,W/2,H/2);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

// ---- EFFECTS ----
function addEfx(f,txt,col,sz){f.efx.push({txt,col,sz,x:f.x+6,y:f.y-108,life:34,ml:34});}
function hitParts(x,y,col,n){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*5+3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:22,ml:22,sz:Math.random()*4+2,col});
  }
}
function drawParts(){
  parts=parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;p.sz*=0.88;
    if(p.sz<0.3)return false;
    ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;return p.life>0;
  });
}
function drawEfx(f){
  f.efx=f.efx.filter(e=>{
    e.life--;
    ctx.save();ctx.globalAlpha=Math.min(1,e.life/e.ml*2);
    ctx.font=`bold ${e.sz}px monospace`;
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeText(e.txt,e.x,e.y);
    ctx.fillStyle=e.col;ctx.fillText(e.txt,e.x,e.y);
    e.y-=1.1;ctx.restore();return e.life>0;
  });
}

// ---- COMBAT ----
function getHurtbox(f){
  const cr=f.state==='crouch'||f.atkType==='cPunch'||f.atkType==='cKick';
  return{x:f.x+6,y:f.y-(cr?52:f.h),w:f.w-12,h:cr?52:f.h};
}
function getHitbox(f){
  if(f.atkPhase!==2)return null;
  const d=ATK[f.atkType];if(!d)return null;
  const rx=f.facing===1?d.rx:-(d.rx+d.rw);
  return{x:f.x+f.w/2+rx,y:f.y+d.ry,w:d.rw,h:d.rh,dmg:d.dmg};
}
function ovlp(a,b){return a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function tryHit(att,def){
  const ab=getHitbox(att);
  if(!ab||!ovlp(ab,getHurtbox(def))||def.hitT>0)return;
  const blk=def.blkT>0&&def.facing!==att.facing;
  const dmg=blk?1:ab.dmg;
  if(blk){addEfx(def,'GUARD','#88CCFF',12);hitParts(ab.x+ab.w*0.7,ab.y+ab.h/2,'#88CCFF',5);}
  else{hitParts(ab.x+(att.facing===1?ab.w:0),ab.y+ab.h/2,'#FFE044',12);addEfx(def,'-'+dmg,'#FF4444',15);att.sp=Math.min(att.msp,att.sp+10);}
  def.hp=Math.max(0,def.hp-dmg);def.hitT=22;def.vx=att.facing*2.5;
  if(def.hp<=0)endR();
}
function startAtk(f,type){
  if(f.atkPhase!==0)return false;
  if(type==='special'&&f.sp<f.msp)return false;
  const d=ATK[type];
  if(type==='special'){f.atkSt=8;f.atkAc=14;f.atkRc=20;f.atkTimer=8;f.state='special';}
  else{if(!d)return false;f.atkSt=d.st;f.atkAc=d.ac;f.atkRc=d.rc;f.atkTimer=d.st;f.state=type;}
  f.atkType=type;f.atkPhase=1;return true;
}
function tickAtk(f){
  if(f.atkPhase===0)return;
  f.atkTimer--;
  if(f.atkTimer<=0){
    if(f.atkPhase===1){f.atkPhase=2;f.atkTimer=f.atkAc;if(f.atkType==='special')fireHadouken(f);}
    else if(f.atkPhase===2){f.atkPhase=3;f.atkTimer=f.atkRc;}
    else{f.atkPhase=0;f.atkTimer=0;if(f.onG)f.state='idle';f.atkType='';}
  }
}

// ---- PLAYER 1 ----
function handleP1(){
  const f=p1; f.animT++;
  // merge keyboard
  syncKeys();
  if(f.hitT>0){f.hitT--;f.vx*=0.75;f.x+=f.vx;f.y+=f.vy;f.vy+=0.65;if(f.y>=GND){f.y=GND;f.vy=0;f.onG=true;}return;}
  tickAtk(f);
  const up=vk.up, dn=vk.down, lt=vk.left, rt=vk.right;
  const pn=vk.punch, ki=vk.kick, sp=vk.special;
  if(f.blkT>0)f.blkT--;
  if((lt&&f.facing===1)||(rt&&f.facing===-1))f.blkT=8;
  if(f.onG){
    if(up){f.vy=-16;f.onG=false;f.state='jump';}
    if(lt){f.vx=-4.8;if(f.atkPhase===0){f.state='walk';f.facing=-1;}}
    else if(rt){f.vx=4.8;if(f.atkPhase===0){f.state='walk';f.facing=1;}}
    else f.vx*=0.55;
    if(f.atkPhase===0){
      if(sp)        startAtk(f,'special');
      else if(pn)   startAtk(f, dn?'cPunch':'punch');
      else if(ki)   startAtk(f, dn?'cKick':'kick');
      else if(dn)   f.state='crouch';
      else if(!lt&&!rt) f.state='idle';
    }
  } else {
    f.vy+=0.65;
    if(lt)f.vx=Math.max(f.vx-0.4,-4.5);
    if(rt)f.vx=Math.min(f.vx+0.4,4.5);
    if(f.atkPhase===0){
      if(pn) startAtk(f,'jPunch');
      else if(ki) startAtk(f,'jKick');
    }
  }
  f.x+=f.vx; f.y+=f.vy;
  if(f.y>=GND){f.y=GND;f.vy=0;f.onG=true;if(f.atkPhase===0)f.state='idle';}
  if(f.x<2)f.x=2; if(f.x+f.w>W-2)f.x=W-2-f.w;
}

// ---- AI (KEN) ----
function aiTick(){
  const f=p2, en=p1; f.animT++;
  if(f.hitT>0){f.hitT--;f.vx*=0.75;f.x+=f.vx;f.y+=f.vy;f.vy+=0.65;if(f.y>=GND){f.y=GND;f.vy=0;f.onG=true;}return;}
  tickAtk(f);
  f.facing=en.x>f.x?1:-1;
  const d=Math.abs(f.x+f.w/2-(en.x+en.w/2)), r=Math.random();
  if(f.blkT>0)f.blkT--;
  if(f.aiCD>0){f.aiCD--;f.x+=f.vx;f.y+=f.vy;f.vy+=0.65;if(f.y>=GND){f.y=GND;f.vy=0;f.onG=true;}return;}
  const threat=projs.find(p=>p.isP1&&Math.abs(p.x-f.x)<190);
  if(threat&&f.onG&&r<0.5){f.vy=-16;f.onG=false;f.aiCD=10;}
  if(f.atkPhase===0){
    if((en.atkPhase===2||en.state==='special')&&d<140&&r<0.5){f.blkT=12;f.vx=0;}
    else if(d>105)f.vx=f.facing*4.5;
    else if(d<50)f.vx=-f.facing*3;
    else f.vx*=0.5;
    if(f.onG&&r<0.007&&d<170){f.vy=-16;f.onG=false;}
    if(d<105&&f.onG){
      if(f.sp>=f.msp&&r<0.018){startAtk(f,'special');f.aiCD=24;}
      else if(r<0.065){startAtk(f,r<0.04?'punch':'kick');f.aiCD=9;}
      else if(d<72&&r<0.04){startAtk(f,'cPunch');f.aiCD=9;}
    }
    if(!f.onG&&en.onG&&r<0.05)startAtk(f,'jKick');
    if(f.atkPhase===0&&f.onG)f.state=Math.abs(f.vx)>0.5?'walk':'idle';
  }
  f.vy+=0.65; f.x+=f.vx; f.y+=f.vy;
  if(f.y>=GND){f.y=GND;f.vy=0;f.onG=true;if(f.atkPhase===0)f.state='idle';}
  if(f.x<2)f.x=2; if(f.x+f.w>W-2)f.x=W-2-f.w;
}

function endR(){
  clearInterval(tiv); gst='over';
  let wn;
  if(p1.hp<=0){p2.wins++;wn='KEN';}
  else if(p2.hp<=0){p1.wins++;wn='RYU';}
  else if(p1.hp>=p2.hp){p1.wins++;wn='RYU';}
  else{p2.wins++;wn='KEN';}
  rnd++; flashMsg=wn+' WINS!'; flashT=130;
  setTimeout(()=>{
    document.getElementById('wt').textContent=wn+' WINS!';
    document.getElementById('rt').textContent='Round '+(rnd-1);
    document.getElementById('gs').style.display='flex';
  },2000);
}

// ---- MAIN LOOP ----
function loop(){
  ctx.clearRect(0,0,W,H);
  const sx=shake>0?(Math.random()-0.5)*shake:0;
  const sy=shake>0?(Math.random()-0.5)*shake*0.5:0;
  if(shake>0)shake--;
  ctx.save(); ctx.translate(sx,sy);
  drawBG();
  if(gst==='fight'||gst==='over'){
    if(gst==='fight'){
      handleP1(); aiTick();
      if(p1.x+p1.w>p2.x+8&&p1.x<p2.x+p2.w-8){
        const ov=(p1.x+p1.w-p2.x)/2; p1.x-=ov; p2.x+=ov;
        if(p1.x<2)p1.x=2; if(p2.x+p2.w>W-2)p2.x=W-2-p2.w;
      }
      tryHit(p1,p2); tryHit(p2,p1);
    }
    drawRyu(p1); drawKen(p2);
    drawProjs(); drawParts();
    drawEfx(p1); drawEfx(p2);
    drawHUD();
  }
  ctx.restore();
  requestAnimationFrame(loop);
}

document.getElementById('s1').onclick=()=>{document.getElementById('ts').style.display='none';rnd=1;initR();};
document.getElementById('rb').onclick=()=>{document.getElementById('gs').style.display='none';initR();};
document.getElementById('mb').onclick=()=>{
  document.getElementById('gs').style.display='none';
  document.getElementById('ts').style.display='flex';
  clearInterval(tiv);gst='menu';rnd=1;
};
loop();
</script>
